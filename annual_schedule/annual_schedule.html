<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    年間計画 | 岩瀬自治会 防災
</title>

<link
    rel="stylesheet"
    href="../style.css"
>


<style>

/* ==================================================
   基本
================================================== */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    background-color: #f7f7f7;

}


/* ==================================================
   年間計画
================================================== */

.annual-plan {

    width: 100%;

    max-width: 900px;

    margin: 0 auto;

    padding: 30px 20px 50px;

    text-align: center;

}


.annual-plan h1 {

    margin: 0 0 30px;

    font-size: 32px;

}


/* ==================================================
   ギャラリー
================================================== */

.schedule-gallery {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 25px;

}


.schedule-image {

    display: block;

    width: 100%;

    max-width: 800px;

    height: auto;

    border-radius: 15px;

    background: #eeeeee;

    box-shadow:
        0 4px 10px
        rgba(0, 0, 0, 0.20);

}


/* ==================================================
   読み込み
================================================== */

.loading {

    width: 100%;

    padding: 35px 20px;

    color: #777777;

}


.empty {

    width: 100%;

    padding: 35px 20px;

    color: #777777;

    background: #eeeeee;

    border-radius: 10px;

}


.error {

    width: 100%;

    padding: 20px;

    color: #b71c1c;

    background: #ffebee;

    border-radius: 10px;

    line-height: 1.7;

    word-break: break-word;

}


/* ==================================================
   戻るボタン
================================================== */

.back-button {

    display: block;

    width: fit-content;

    margin: 30px auto 0;

    padding: 15px 35px;

    background-color: #1976d2;

    color: #ffffff;

    text-decoration: none;

    border-radius: 30px;

    font-size: 18px;

    font-weight: bold;

    transition:
        background-color 0.2s ease,
        transform 0.15s ease;

}


.back-button:hover {

    background-color: #125ea8;

}


.back-button:active {

    transform: scale(0.98);

}


/* ==================================================
   スマートフォン
================================================== */

@media (max-width: 600px) {

    .annual-plan {

        padding: 25px 15px 40px;

    }


    .annual-plan h1 {

        font-size: 24px;

        margin-bottom: 25px;

    }


    .schedule-gallery {

        gap: 18px;

    }


    .schedule-image {

        border-radius: 10px;

    }


    .back-button {

        width: 80%;

        max-width: 300px;

        padding: 14px 20px;

        font-size: 16px;

    }

}

</style>

</head>


<body>


<section class="annual-plan">


    <h1>
        🗓️ 年間計画
    </h1>


    <div
        id="scheduleGallery"
        class="schedule-gallery"
    >

        <div class="loading">
            読み込み中...
        </div>

    </div>


    <a
        href="../index.html"
        class="back-button"
    >
        トップページへ戻る
    </a>


</section>


<!-- ==================================================
     Supabase
================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

"use strict";


/* ==================================================
   Supabase設定
================================================== */

const SUPABASE_URL =
    "https://zumbqukrojdpgfpfekjr.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_8YXsMHOxLr7MOTEYShUM3w_LsZvR3Qn";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==================================================
   年間計画読み込み
================================================== */

async function loadSchedule() {

    const gallery =
        document.getElementById(
            "scheduleGallery"
        );


    if (!gallery) {
        return;
    }


    gallery.innerHTML = `
        <div class="loading">
            読み込み中...
        </div>
    `;


    try {

        /*
           content_group_id は使用しない
           
           annual_schedule のみ取得
        */

        const {
            data,
            error
        } =
        await supabaseClient
            .from("site_contents")
            .select(
                "id, content_type, slot, title, image_url, storage_path"
            )
            .eq(
                "content_type",
                "annual_schedule"
            )
            .order(
                "slot",
                {
                    ascending: true
                }
            );


        if (error) {

            console.error(
                "Supabase error:",
                error
            );

            throw error;

        }


        gallery.innerHTML = "";


        /*
           画像が存在するものだけ
        */

        const items =
            (data || [])
                .filter(
                    item =>
                        item.image_url
                )
                .slice(
                    0,
                    3
                );


        /*
           登録なし
        */

        if (
            items.length === 0
        ) {

            gallery.innerHTML = `
                <div class="empty">
                    現在、年間計画は登録されていません。
                </div>
            `;

            return;

        }


        /*
           画像表示
        */

        items.forEach(
            (item) => {

                const img =
                    document.createElement(
                        "img"
                    );


                /*
                   キャッシュ対策
                */

                const separator =
                    item.image_url.includes("?")
                        ? "&"
                        : "?";


                img.src =
                    item.image_url +
                    separator +
                    "v=" +
                    encodeURIComponent(
                        item.id
                    );


                img.alt =
                    item.title ||
                    "年間計画";


                img.loading =
                    "lazy";


                img.addEventListener(
                    "error",
                    () => {

                        console.error(
                            "画像読み込み失敗:",
                            item.image_url
                        );

                    }
                );


                img.className =
                    "schedule-image";


                gallery.appendChild(
                    img
                );

            }
        );


    } catch (error) {

        console.error(
            "loadSchedule error:",
            error
        );


        gallery.innerHTML = `
            <div class="error">
                年間計画を読み込めませんでした。<br>
                時間をおいて再度お試しください。
            </div>
        `;

    }

}


/* ==================================================
   実行
================================================== */

loadSchedule();

</script>


</body>

</html>
