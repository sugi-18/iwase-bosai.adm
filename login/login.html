<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    岩瀬自治会 防災アプリ
</title>

<link
    rel="stylesheet"
    href="login.css"
>

</head>


<body>


<div class="login-container">


<h1>
🚒 岩瀬自治会<br>
防災アプリ
</h1>


<p class="login-message">

岩瀬自治会員の方は<br>
アクセスコードを入力してください。

</p>


<div class="login-box">


<input
    type="password"
    id="access-code"
    placeholder="アクセスコード"
    autocomplete="off"
>


<button
    type="button"
    id="login-button"
    onclick="login()"
>

利用開始

</button>


<p
    id="error-message"
    aria-live="polite"
></p>


</div>


<div class="notice">


<h2>
ご利用について
</h2>


<p>

本アプリは岩瀬自治会の防災活動を支援、展開するためのWebアプリです。

</p>


<p>

自治会員用アクセスコードが必要です。
アクセスコードをお持ちでない方はご利用いただけません。

</p>


<p>

本アプリおよびコンテンツの無断転載・転用を禁止します。

</p>


</div>


</div>


<!-- Supabase -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
    src="../stamp/supabase.js"
></script>


<script
    src="login.js"
></script>


</body>

</html>
