<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    岩瀬自治会 防災アプリ
</title>

<link
    rel="stylesheet"
    href="login.css"
>

</head>


<body>


<div class="login-container">


<h1>
🚒 岩瀬自治会<br>
防災アプリ
</h1>


<p class="login-message">

初めて利用する方は<br>
自治会コードと氏名を登録してください。

</p>


<div class="login-box">


<input
    type="password"
    id="access-code"
    placeholder="自治会コード"
    autocomplete="off"
>


<input
    type="text"
    id="username"
    placeholder="氏名"
    autocomplete="name"
>


<button
    type="button"
    id="login-button"
    onclick="login()"
>

利用登録して開始

</button>


<p
    id="error-message"
    aria-live="polite"
></p>


</div>


<div class="notice">


<h2>
ご利用について
</h2>


<p>

本アプリは岩瀬自治会の防災活動を支援するためのWebアプリです。

</p>


<p>

自治会コードと氏名の登録が必要です。
自治会員用コードをお持ちでない方はご利用いただけません。

</p>


<p>

登録した利用者情報は、
訓練参加・スタンプ管理のためSupabaseに保存されます。

</p>


<p>

退会時には利用者情報および訓練参加記録を削除します。

</p>


</div>


</div>


<!-- Supabase -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
    src="../stamp/supabase.js"
></script>


<script
    src="login.js"
></script>


</body>

</html>
