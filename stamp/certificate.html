<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
いわぽん防災マイスター認定証
</title>


<link rel="stylesheet"
      href="certificate.css">


<!-- html2canvas -->
<script
    src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
</script>


<!-- jsPDF -->
<script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
</script>

</head>


<body>


<!-- =====================================================
     認定証
===================================================== -->

<div id="certificate">

    <h1>
        認定証
    </h1>


    <p class="message">

        あなたは防災訓練・講座に積極的に参加し、

        <br>

        地域防災力向上に貢献しました。

    </p>


    <h2>
        いわぽん防災マイスター
    </h2>


    <p class="certification">
        として認定します。
    </p>


    <div class="info">

        <p>
            氏名：
            <span id="name"></span>
        </p>


        <p>
            認定日：
            <span id="date"></span>
        </p>


        <p>
            認定番号：
            <span id="number"></span>
        </p>

    </div>


    <p class="organization">
        岩瀬自治会
    </p>

</div>



<!-- =====================================================
     PDFボタン
===================================================== -->

<button
    type="button"
    id="pdf-button">

    認定証PDFを見る

</button>


<!-- =====================================================
     JavaScript
===================================================== -->

<script src="certificate.js"></script>


</body>

</html>
