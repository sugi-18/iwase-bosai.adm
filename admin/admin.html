<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"




<title> 管理者画面 | いわぽん防災 </title>

<link rel="stylesheet" href="admin.css" >

</head>

<body>

<!-- ================================================== 管理者ログイン画面 ================================================== -->

<div id="loginScreen" class="screen" >

<div class="login-box">

    <h1>
        管理者ログイン
    </h1>


    <p class="login-description">
        いわぽん防災<br>
        管理者専用画面
    </p>


    <form id="loginForm">

        <label for="email">
            メールアドレス
        </label>


        <input
            type="email"
            id="email"
            placeholder="メールアドレス"
            autocomplete="username"
            required
        >


        <label for="password">
            パスワード
        </label>


        <input
            type="password"
            id="password"
            placeholder="パスワード"
            autocomplete="current-password"
            required
        >


        <button
            type="submit"
            class="primary-button"
        >
            ログイン
        </button>

    </form>


    <p
        id="loginError"
        class="error-message"
    ></p>

</div>

</div>




<!-- ================================================== 管理者画面 ================================================== -->

<div id="adminScreen" class="screen hidden" >

<!-- ==================================================
     ヘッダー
================================================== -->

<header class="admin-header">

    <div>

        <h1>
            管理者画面
        </h1>

        <p>
            いわぽん防災
        </p>

    </div>


    <button
        id="logoutButton"
        class="logout-button"
    >
        ログアウト
    </button>

</header>



<!-- ==================================================
     メイン
================================================== -->

<main class="admin-container">


    <!-- ==================================================
         ダッシュボード
    ================================================== -->

    <section
        id="dashboardSection"
        class="admin-section"
    >

        <h2>
            ダッシュボード
        </h2>


        <div class="stats-grid">


            <!-- 登録参加者 -->

            <div class="stat-card">

                <span class="stat-label">
                    登録参加者
                </span>


                <div>

                    <strong
                        id="participantCount"
                    >
                        0
                    </strong>

                    <span>
                        人
                    </span>

                </div>

            </div>



            <!-- 訓練 -->

            <div class="stat-card">

                <span class="stat-label">
                    訓練・講座
                </span>


                <div>

                    <strong
                        id="trainingCount"
                    >
                        0
                    </strong>

                    <span>
                        件
                    </span>

                </div>

            </div>



            <!-- 参加記録 -->

            <div class="stat-card">

                <span class="stat-label">
                    参加記録
                </span>


                <div>

                    <strong
                        id="participationCount"
                    >
                        0
                    </strong>

                    <span>
                        件
                    </span>

                </div>

            </div>

        </div>



        <!-- 最近の参加記録 -->

        <div class="dashboard-card">

            <h3>
                最近の参加記録
            </h3>


            <div
                id="recentParticipations"
            >
                読み込み中...
            </div>

        </div>

    </section>



    <!-- ==================================================
         管理メニュー
    ================================================== -->

    <nav class="admin-nav">


        <button
            type="button"
            class="nav-button active"
            data-target="participantsSection"
        >
            参加者管理
        </button>


        <button
            type="button"
            class="nav-button"
            data-target="trainingsSection"
        >
            訓練・講座管理
        </button>


        <button
            type="button"
            class="nav-button"
            data-target="participationsSection"
        >
            参加履歴
        </button>


    </nav>



    <!-- ==================================================
         参加者管理
    ================================================== -->

    <section
        id="participantsSection"
        class="admin-section content-section"
    >

        <div class="section-header">

            <div>

                <h2>
                    参加者管理
                </h2>

                <p>
                    登録されている参加者を管理します。
                </p>

            </div>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            参加者ID
                        </th>

                        <th>
                            名前
                        </th>

                        <th>
                            登録日時
                        </th>

                        <th>
                            操作
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="participantsTable"
                >

                    <tr>

                        <td colspan="4">
                            読み込み中...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>



    <!-- ==================================================
         訓練・講座管理
    ================================================== -->

    <section
        id="trainingsSection"
        class="admin-section content-section hidden"
    >

        <div class="section-header">

            <div>

                <h2>
                    訓練・講座管理
                </h2>

                <p>
                    訓練や講座の登録・編集・削除を行います。
                </p>

            </div>


            <button
                type="button"
                id="addTrainingButton"
                class="primary-button"
            >
                ＋ 新規登録
            </button>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            訓練ID
                        </th>

                        <th>
                            タイトル
                        </th>

                        <th>
                            登録日時
                        </th>

                        <th>
                            操作
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="trainingsTable"
                >

                    <tr>

                        <td colspan="4">
                            読み込み中...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>



    <!-- ==================================================
         参加履歴
    ================================================== -->

    <section
        id="participationsSection"
        class="admin-section content-section hidden"
    >

        <div class="section-header">

            <div>

                <h2>
                    参加履歴
                </h2>

                <p>
                    訓練・講座への参加記録を管理します。
                </p>

            </div>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            参加者ID
                        </th>

                        <th>
                            訓練ID
                        </th>

                        <th>
                            参加日時
                        </th>

                        <th>
                            操作
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="participationsTable"
                >

                    <tr>

                        <td colspan="4">
                            読み込み中...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>


</main>

</div>




<!-- ================================================== 参加者編集モーダル ================================================== -->

<div id="participantModal" class="modal hidden" >

<div class="modal-content">

    <h2>
        参加者編集
    </h2>


    <input
        type="hidden"
        id="editParticipantDbId"
    >


    <label for="editParticipantId">
        参加者ID
    </label>


    <input
        type="text"
        id="editParticipantId"
        readonly
    >


    <label for="editParticipantName">
        名前
    </label>


    <input
        type="text"
        id="editParticipantName"
        placeholder="名前"
    >


    <div class="modal-buttons">


        <button
            type="button"
            id="cancelParticipantButton"
            class="secondary-button"
        >
            キャンセル
        </button>


        <button
            type="button"
            id="saveParticipantButton"
            class="primary-button"
        >
            保存
        </button>


    </div>

</div>

</div>




<!-- ================================================== 訓練編集・登録モーダル ================================================== -->

<div id="trainingModal" class="modal hidden" >

<div class="modal-content">

    <h2 id="trainingModalTitle">
        訓練・講座を登録
    </h2>


    <input
        type="hidden"
        id="editTrainingDbId"
    >


    <label for="editTrainingId">
        訓練ID
    </label>


    <input
        type="text"
        id="editTrainingId"
        placeholder="例：training001"
    >


    <label for="editTrainingTitle">
        タイトル
    </label>


    <input
        type="text"
        id="editTrainingTitle"
        placeholder="例：夏季防災訓練"
    >


    <div class="modal-buttons">


        <button
            type="button"
            id="cancelTrainingButton"
            class="secondary-button"
        >
            キャンセル
        </button>


        <button
            type="button"
            id="saveTrainingButton"
            class="primary-button"
        >
            保存
        </button>


    </div>

</div>

</div>




<!-- ================================================== JavaScript 読み込み順が重要です。 ① Supabase本体 ② 現在使用しているsupabase.js ③ 管理画面のadmin.js ================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" ></script>

<script src="../stamp/supabase.js" ></script>

<script src="admin.js" ></script>

</body>

</html>
