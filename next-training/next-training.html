<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    岩瀬防災訓練
</title>

<style>

/* ==================================================
   基本
================================================== */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        "Meiryo",
        sans-serif;

    background-color: #f7f7f7;

    color: #333;

}


/* ==================================================
   ヘッダー
================================================== */

.header {

    background-color: #d62828;

    color: #ffffff;

    padding: 30px 20px;

    text-align: center;

}


.header h1 {

    margin: 0 0 10px;

    font-size: 28px;

}


.header p {

    margin: 0;

    font-size: 16px;

    line-height: 1.6;

}


/* ==================================================
   メイン
================================================== */

main {

    width: 100%;

    max-width: 900px;

    margin: 0 auto;

    padding: 30px 20px 50px;

}


/* ==================================================
   セクション
================================================== */

.training-photo-area {

    margin: 0 auto 40px;

    text-align: center;

}


.training-photo-area h2 {

    display: inline-block;

    margin: 0 0 30px;

    padding-bottom: 8px;

    color: #d62828;

    border-bottom: 4px solid #d62828;

    font-size: 24px;

}


/* ==================================================
   写真一覧
================================================== */

.training-gallery {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 25px;

}


.training-gallery img {

    display: block;

    width: 100%;

    max-width: 800px;

    height: auto;

    border-radius: 10px;

    background: #eeeeee;

    box-shadow:
        0 3px 10px
        rgba(0, 0, 0, 0.15);

}


/* ==================================================
   読み込み・空表示
================================================== */

.loading {

    width: 100%;

    padding: 35px 20px;

    text-align: center;

    color: #777777;

}


.empty {

    width: 100%;

    padding: 35px 20px;

    text-align: center;

    color: #777777;

    background: #eeeeee;

    border-radius: 10px;

}


.error {

    width: 100%;

    padding: 20px;

    text-align: center;

    color: #b71c1c;

    background: #ffebee;

    border-radius: 10px;

    line-height: 1.7;

    word-break: break-word;

}


/* ==================================================
   戻るボタン
================================================== */

.back-button {

    display: block;

    width: fit-content;

    margin: 10px auto 0;

    padding: 15px 35px;

    background-color: #1976d2;

    color: #ffffff;

    text-decoration: none;

    border-radius: 30px;

    font-size: 18px;

    font-weight: bold;

    text-align: center;

    transition:
        background-color 0.2s ease,
        transform 0.15s ease;

}


.back-button:hover {

    background-color: #125ea8;

}


.back-button:active {

    transform: scale(0.98);

}


/* ==================================================
   スマートフォン
================================================== */

@media (max-width: 600px) {

    .header {

        padding: 25px 15px;

    }


    .header h1 {

        font-size: 24px;

    }


    .header p {

        font-size: 14px;

    }


    main {

        padding: 25px 15px 40px;

    }


    .training-photo-area h2 {

        font-size: 22px;

    }


    .training-gallery {

        gap: 18px;

    }


    .training-gallery img {

        border-radius: 8px;

    }


    .back-button {

        width: 80%;

        max-width: 300px;

        padding: 14px 20px;

        font-size: 16px;

    }

}

</style>

</head>


<body>


<!-- ==================================================
     ヘッダー
================================================== -->

<header class="header">

    <h1>
        📅 岩瀬防災訓練
    </h1>

    <p>
        次回防災訓練のお知らせ
    </p>

</header>


<!-- ==================================================
     メイン
================================================== -->

<main>

    <section class="training-photo-area">

        <h2>
            次回訓練案内
        </h2>


        <div
            id="trainingGallery"
            class="training-gallery"
        >

            <div class="loading">
                読み込み中...
            </div>

        </div>

    </section>


    <a
        href="../index.html"
        class="back-button"
    >
        トップページへ戻る
    </a>

</main>


<!-- ==================================================
     Supabase
================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

"use strict";


/* ==================================================
   Supabase設定
================================================== */

const SUPABASE_URL =
    "https://zumbqukrojdpgfpfekjr.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_8YXsMHOxLr7MOTEYShUM3w_LsZvR3Qn";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==================================================
   次回訓練読み込み
================================================== */

async function loadTrainingImages() {

    const gallery =
        document.getElementById(
            "trainingGallery"
        );


    if (!gallery) {
        return;
    }


    gallery.innerHTML = `
        <div class="loading">
            読み込み中...
        </div>
    `;


    try {

        /*
           content_group_id は条件にしない
           
           next_training のデータだけ取得
        */

        const {
            data,
            error
        } =
        await supabaseClient
            .from("site_contents")
            .select(
                "id, content_type, slot, title, image_url, storage_path"
            )
            .eq(
                "content_type",
                "next_training"
            )
            .order(
                "slot",
                {
                    ascending: true
                }
            );


        if (error) {

            console.error(
                "Supabase error:",
                error
            );

            throw error;

        }


        gallery.innerHTML = "";


        /*
           画像URLが存在するものだけ表示
        */

        const items =
            (data || [])
                .filter(
                    item =>
                        item.image_url
                )
                .slice(
                    0,
                    3
                );


        /*
           登録なし
        */

        if (
            items.length === 0
        ) {

            gallery.innerHTML = `
                <div class="empty">
                    現在、次回訓練の案内はありません。
                </div>
            `;

            return;

        }


        /*
           画像表示
        */

        items.forEach(
            (item) => {

                const img =
                    document.createElement(
                        "img"
                    );


                /*
                   キャッシュ対策
                */

                const separator =
                    item.image_url.includes("?")
                        ? "&"
                        : "?";


                img.src =
                    item.image_url +
                    separator +
                    "v=" +
                    encodeURIComponent(
                        item.id
                    );


                img.alt =
                    item.title ||
                    "次回防災訓練案内";


                img.loading =
                    "lazy";


                img.addEventListener(
                    "error",
                    () => {

                        console.error(
                            "画像読み込み失敗:",
                            item.image_url
                        );

                    }
                );


                gallery.appendChild(
                    img
                );

            }
        );


    } catch (error) {

        console.error(
            "loadTrainingImages error:",
            error
        );


        gallery.innerHTML = `
            <div class="error">
                次回訓練の案内を読み込めませんでした。<br>
                時間をおいて再度お試しください。
            </div>
        `;

    }

}


/* ==================================================
   実行
================================================== */

loadTrainingImages();

</script>


</body>

</html>
